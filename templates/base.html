{% load static %}<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hòm Phiếu Cộng Đồng{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a class="brand" href="/">🗳️ Hòm Phiếu Cộng Đồng</a>
            <a class="link {% block nav_home %}{% endblock %}" href="/">Khám phá</a>
            <a class="link {% block nav_create %}{% endblock %}" href="/create/">Tạo hòm phiếu</a>
            <a class="link {% block nav_my %}{% endblock %}" href="/my/">Của tôi</a>
            <a class="link {% block nav_verify %}{% endblock %}" href="/verify/">Xác minh phiếu</a>
            <span class="spacer"></span>
            <button id="btnWallet" class="btn-ghost" type="button">🦊 Kết nối ví</button>
        </div>
    </nav>

    <div class="container">
        <div id="banner"></div>
        {% block content %}{% endblock %}
    </div>
    <div id="toasts"></div>

    <script src="{% static 'vendor/ethers.umd.min.js' %}"></script>
    <script src="{% static 'js/abi.js' %}"></script>
    <script src="{% static 'js/common.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
