{% load i18n %}
<div class="my-3">
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
    {% for model_name, object_count in model_count %}
    <div class="p-3 rounded-xl bg-slate-50 border border-slate-200">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider font-mono block">{{ model_name|capfirst }}</span>
      <span class="text-xl font-extrabold text-slate-900 font-mono mt-0.5 block">{{ object_count }}</span>
    </div>
    {% endfor %}
  </div>
</div>
