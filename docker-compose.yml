services:
  db:
    image: postgres:15-alpine
    container_name: election_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Kiểm tra xem Postgres đã thực sự khởi động xong chưa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Mở port 5432 ra ngoài để bạn vẫn có thể dùng DataGrip / pgAdmin kết nối vào xem DB
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    image: redis:7-alpine
    container_name: election_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  web:
    build: .
    container_name: election_web
    restart: unless-stopped
    # Chạy lệnh migrate trước khi bật Server Daphne
    command: sh -c "python manage.py makemigrations election && python manage.py migrate && daphne -b 0.0.0.0 -p 8000 core.asgi:application"    
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes: 
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  indexer:
    build: .
    container_name: election_indexer
    restart: unless-stopped
    command: python indexer/chain_watcher.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
